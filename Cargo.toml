[workspace]
resolver = "2"
members = ["xtask"]

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT"
authors = ["ByteLand Technology Limited"]
repository = "https://github.com/byteland-app/flow-mcp"
homepage = "https://github.com/byteland-app/flow-mcp"

[workspace.lints.rust]
missing_docs = "deny"
unreachable_pub = "deny"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
allow_attributes = "deny"
expect_used = "deny"
missing_docs_in_private_items = "deny"
unwrap_used = "deny"

[workspace.lints.rustdoc]
bare_urls = "deny"
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"

[package]
name = "flow-mcp"
version = "0.2.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Rust MCP server for Google Flow with Chrome CDP browser engine"

[dependencies]

[lints]
workspace = true

[profile.release]
panic = "unwind"
lto = "thin"
codegen-units = 1
strip = "symbols"
